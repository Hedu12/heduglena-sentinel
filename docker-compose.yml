version: "3.9"

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override DATABASE_URL to use the named volume mount
      DATABASE_URL: "sqlite+aiosqlite:////data/sentinel.db"
    volumes:
      - sentinel-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: "http://localhost:8000"
      VITE_WS_URL: "ws://localhost:8000/ws/live"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sentinel-data:
    driver: local
